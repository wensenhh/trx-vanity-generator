name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install cmake openssl fltk
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -DBUILD_GUI=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-macos-x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install cmake openssl fltk
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -DBUILD_GUI=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev ocl-icd-opencl-dev opencl-headers
      - name: Configure (GUI disabled)
        run: cmake -S . -B build -DBUILD_TESTS=ON -DBUILD_GUI=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          vcpkg install openssl --triplet x64-windows
      - name: Configure (GUI disabled)
        run: cmake -S . -B build -DBUILD_TESTS=ON -DBUILD_GUI=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
        shell: pwsh
      - name: Build
        run: cmake --build build --parallel --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
