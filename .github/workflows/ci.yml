name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            arch: arm64
            build_gui: ON

          - name: macOS (x86_64)
            os: macos-13
            arch: x86_64
            build_gui: ON

          - name: Ubuntu (x86_64)
            os: ubuntu-latest
            arch: x86_64
            build_gui: OFF

          - name: Windows (x86_64)
            os: windows-latest
            arch: x86_64
            build_gui: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libssl-dev \
            ocl-icd-opencl-dev \
            opencl-headers

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl fltk

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl --triplet x64-windows

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DBUILD_TESTS=ON \
            -DBUILD_GUI=${{ matrix.build_gui }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DBUILD_TESTS=ON `
            -DBUILD_GUI=${{ matrix.build_gui }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package
        run: |
          cd build
          cpack -G "TGZ;ZIP" -C Release
        shell: bash
        continue-on-error: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/trx_vanity-*.{tar.gz,zip,dmg,exe}
            build/Release/*.exe
            build/Release/*.dll
          if-no-files-found: ignore
